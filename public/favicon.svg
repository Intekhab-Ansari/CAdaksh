<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none" role="img" aria-label="Chartered Accountants India Emblem">
  <!-- Rounded Dignified Border -->
  <rect x="3" y="3" width="154" height="154" rx="14" fill="#0C251F" stroke="#B88D30" stroke-width="2.5" />
  <rect x="8" y="8" width="144" height="144" rx="10" fill="none" stroke="#B88D30" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
  
  <!-- Stylized CA Letters -->
  <!-- Letter C -->
  <path d="M 68 52 C 60 44, 42 42, 34 56 C 24 72, 24 96, 36 110 C 44 120, 60 120, 68 112 C 72 108, 74 102, 74 102 L 61 97 C 61 97, 58 102, 53 105 C 47 108, 41 106, 37 98 C 33 88, 33 74, 38 66 C 43 59, 50 58, 56 61 C 61 64, 63 68, 63 68 Z" fill="#FFFFFF" />
  
  <!-- Letter A with stylized checkmark/crossbar -->
  <path d="M 86 116 L 98 44 L 111 44 L 129 116 L 115 116 L 111 96 L 93 96 L 89 116 Z M 96 84 L 108 84 L 102 58 Z" fill="#FFFFFF" />
  
  <!-- Tricolor Accent on A's Crossbar -->
  <rect x="94" y="88" width="15" height="2" fill="#FF9933" />
  <rect x="94" y="90" width="15" height="2" fill="#FFFFFF" />
  <rect x="94" y="92" width="15" height="2" fill="#138808" />

  <!-- Subtitle INDIA -->
  <text x="80" y="136" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="11" font-weight="600" fill="#B88D30" letter-spacing="3.5">INDIA</text>
</svg>
